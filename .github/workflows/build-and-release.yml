name: Build & Release

on:
  # 직접 push 시 실행
  push:
    branches: [main]
    paths:
      - 'Directory.Build.props'
      - 'src/**'
      # tests/ and the workflow itself gate the release, so a change to either has to re-run this
      # job. Without them a test-only or CI-only change never exercised the gate it modified, and
      # the next release was the first run to use it.
      - 'tests/**'
      - '.github/workflows/build-and-release.yml'

  # 수동 실행 가능
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force publish to NuGet (even if version exists)'
        required: false
        default: false
        type: boolean
      skip_tests:
        description: 'Skip tests for faster deployment'
        required: false
        default: false
        type: boolean

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: 'Release'
  CI: 'true'
  GITHUB_ACTIONS: 'true'
  # Redis tests read this to skip their Testcontainers fixtures (DockerTestHelper).
  SKIP_DOCKER_TESTS: 'true'
  # sqlite-vec is NOT skipped here. Availability is auto-detected from the native asset in the
  # build output, on CI exactly as locally — the package ships runtimes/linux-x64/native/vec0.so.
  # Set ENABLE_SQLITEVEC_TESTS=false only to opt out deliberately.
  # Performance tests are excluded by category in the test step, not by this variable.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    # Always run for push and workflow_dispatch
    - name: Set run flags
      id: changes
      run: |
        echo "should_run=true" >> $GITHUB_OUTPUT
        echo "📦 Trigger: ${{ github.event_name }}"

    - name: Setup .NET
      if: steps.changes.outputs.should_run == 'true'
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # Extract version from Directory.Build.props
    - name: Extract version
      if: steps.changes.outputs.should_run == 'true'
      id: version
      run: |
        VERSION=$(grep '<Version>' Directory.Build.props | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "📦 Version: $VERSION"

    # Clear NuGet cache to avoid hash validation issues
    - name: Clear NuGet cache
      if: steps.changes.outputs.should_run == 'true'
      run: |
        echo "🧹 Clearing NuGet cache to avoid hash validation issues..."
        dotnet nuget locals all --clear
        echo "✅ NuGet cache cleared"

    # Restore, Build, Test
    - name: Restore dependencies
      if: steps.changes.outputs.should_run == 'true'
      run: |
        echo "📦 Restoring packages with central package management..."
        # Force clean restore to avoid any cached issues
        # --force-evaluate: Re-evaluate all packages and update lock files
        # --ignore-failed-sources: Continue even if some sources fail
        dotnet restore --verbosity minimal --force --force-evaluate --ignore-failed-sources
        echo "✅ Package restore completed"

    - name: Build
      if: steps.changes.outputs.should_run == 'true'
      run: |
        echo "🔨 Building solution..."
        dotnet build --no-restore --configuration ${{ env.CONFIGURATION }} --verbosity minimal
        echo "✅ Build completed successfully"

    - name: Run tests
      if: steps.changes.outputs.should_run == 'true' && github.event.inputs.skip_tests != 'true'
      run: |
        echo "🧪 Running tests across every discovered test project"
        echo "   Excluded by category, not by project:"
        echo "     - Integration  (needs an external service: Docker/Testcontainers, a live DB)"
        echo "     - Performance  (asserts on wall-clock time; a shared runner cannot support that)"
        echo ""

        # Enumerate by DISCOVERY, never by allowlist.
        #
        # This step used to carry a hand-maintained CI_SAFE_TESTS list guarded by `if [[ -f ]]`,
        # and it failed silently in both directions: a project deleted from the tree stayed on the
        # list and was skipped with no signal, while projects never added to the list were never
        # run at all. Neither is observable in a green log. Discovery cannot drift from the tree,
        # because the tree is the source.
        #
        # Category filtering replaces project filtering: a test that needs Docker declares
        # [Trait("Category","Integration")] and is excluded wherever it lives — including inside
        # a project that is otherwise CI-safe, which an allowlist can never express.
        mapfile -t TEST_PROJECTS < <(find tests -name '*.Tests.csproj' | sort)

        if [[ ${#TEST_PROJECTS[@]} -eq 0 ]]; then
          echo "::error::No test projects discovered under tests/. Discovery returning nothing is a"
          echo "::error::broken glob or a moved tree — it is never a reason to proceed to publish."
          exit 1
        fi

        echo "Discovered ${#TEST_PROJECTS[@]} test project(s):"
        printf '     %s\n' "${TEST_PROJECTS[@]}"
        echo ""

        # No `|| true`. A failing test must fail this step: FluxIndex 0.24.0 (12 packages) was
        # published on top of two failing tests because the swallow made the step green, and
        # nuget.org packages cannot be withdrawn once pushed.
        for project in "${TEST_PROJECTS[@]}"; do
          echo "🧪 Testing: $project"
          dotnet test "$project" --no-build --configuration ${{ env.CONFIGURATION }} \
            --filter "Category!=Integration&Category!=Performance" \
            --verbosity minimal \
            --collect:"XPlat Code Coverage"
        done

        echo "✅ All discovered test projects passed"

    - name: Skip tests notice
      if: github.event.inputs.skip_tests == 'true'
      run: echo "⏭️ Tests skipped by user request"

    # Create NuGet packages — solution-wide pack ensures all family members are consistent
    - name: Create packages
      if: steps.changes.outputs.should_run == 'true'
      run: |
        echo "📦 Creating NuGet packages via solution-wide pack..."
        mkdir -p ./packages
        dotnet pack FluxIndex.slnx \
          --configuration ${{ env.CONFIGURATION }} \
          --no-build \
          --output ./packages \
          --verbosity minimal
        PACKAGED_COUNT=$(ls ./packages/*.nupkg 2>/dev/null | wc -l)
        echo "📊 Summary: $PACKAGED_COUNT packages created"
        ls -la ./packages/*.nupkg

    # Check if version already exists on NuGet (use FluxIndex.SDK as the canonical check package)
    - name: Check version on NuGet
      if: steps.changes.outputs.should_run == 'true'
      id: version_check
      run: |
        VERSION=${{ steps.version.outputs.version }}
        echo "🔍 Checking if version $VERSION exists on NuGet (FluxIndex.SDK)..."

        RESPONSE=$(curl -s "https://api.nuget.org/v3-flatcontainer/fluxindex.sdk/index.json" || echo '{"versions":[]}')

        if echo "$RESPONSE" | grep -q "\"$VERSION\""; then
          echo "version_exists=true" >> $GITHUB_OUTPUT
          echo "⚠️ Version $VERSION already exists on NuGet — will skip unless force_publish=true"
        else
          echo "version_exists=false" >> $GITHUB_OUTPUT
          echo "✅ Version $VERSION is new"
        fi

    # Publish to NuGet (only if version doesn't exist or force_publish is true)
    - name: Publish to NuGet
      if: |
        steps.changes.outputs.should_run == 'true' &&
        (steps.version_check.outputs.version_exists == 'false' || github.event.inputs.force_publish == 'true')
      run: |
        echo "🚀 Publishing packages to NuGet..."
        for package in ./packages/*.nupkg; do
          echo "Publishing $(basename $package)..."
          dotnet nuget push $package \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        done

    # Build summary
    - name: Summary
      if: always()
      run: |
        echo "## 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| 📦 Version | \`${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| 🏁 Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🚀 Published | ${{ (steps.version_check.outputs.version_exists == 'false' || github.event.inputs.force_publish == 'true') && 'Yes' || 'No' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🎯 .NET | ${{ env.DOTNET_VERSION }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🔧 Config | ${{ env.CONFIGURATION }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🌿 Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 👤 Actor | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [[ "${{ steps.version_check.outputs.version_exists }}" == "true" && "${{ github.event.inputs.force_publish }}" != "true" ]]; then
          echo "ℹ️ **Note**: Version already exists on NuGet, skipped publishing" >> $GITHUB_STEP_SUMMARY
        fi