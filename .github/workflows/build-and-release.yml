name: Build & Release

on:
  # Tests 워크플로우 완료 후 실행 (순차 실행)
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

  # 수동 실행 가능
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force publish to NuGet (even if version exists)'
        required: false
        default: false
        type: boolean

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: 'Release'
  # Ensure CI environment is detected
  CI: 'true'
  GITHUB_ACTIONS: 'true'
  # Skip problematic tests in CI environment
  SKIP_DOCKER_TESTS: 'true'
  # SQLite-vec and performance tests are now skipped by default
  # Use ENABLE_SQLITEVEC_TESTS=true or ENABLE_PERFORMANCE_TESTS=true to enable them

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    # Tests 성공 시에만 실행 (workflow_dispatch는 항상 실행)
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    # Check if Directory.Build.props was changed (for workflow_run trigger)
    - name: Check for version file changes
      id: changes
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "should_run=true" >> $GITHUB_OUTPUT
          echo "📦 Manual trigger - will run"
        else
          # Get changed files from the triggering commit
          COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
          echo "🔍 Checking changes in commit: $COMMIT_SHA"

          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r $COMMIT_SHA 2>/dev/null || echo "")
          echo "Changed files: $CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -q "Directory.Build.props"; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "✅ Directory.Build.props changed - will run"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "⏭️ Directory.Build.props not changed - skipping"
          fi
        fi

    - name: Setup .NET
      if: steps.changes.outputs.should_run == 'true'
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      if: steps.changes.outputs.should_run == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    # Extract version from Directory.Build.props
    - name: Extract version
      if: steps.changes.outputs.should_run == 'true'
      id: version
      run: |
        VERSION=$(grep '<Version>' Directory.Build.props | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "📦 Version: $VERSION"

    # Clear NuGet cache to avoid hash validation issues
    - name: Clear NuGet cache
      if: steps.changes.outputs.should_run == 'true'
      run: |
        echo "🧹 Clearing NuGet cache to avoid hash validation issues..."
        dotnet nuget locals all --clear
        echo "✅ NuGet cache cleared"

    # Restore, Build, Test
    - name: Restore dependencies
      if: steps.changes.outputs.should_run == 'true'
      run: |
        echo "📦 Restoring packages with central package management..."
        # Force clean restore to avoid any cached issues
        # --force-evaluate: Re-evaluate all packages and update lock files
        # --ignore-failed-sources: Continue even if some sources fail
        dotnet restore --verbosity minimal --force --force-evaluate --ignore-failed-sources
        echo "✅ Package restore completed"

    - name: Build
      if: steps.changes.outputs.should_run == 'true'
      run: |
        echo "🔨 Building solution..."
        dotnet build --no-restore --configuration ${{ env.CONFIGURATION }} --verbosity minimal
        echo "✅ Build completed successfully"

    - name: Run tests
      if: steps.changes.outputs.should_run == 'true'
      run: |
        echo "🧪 Running CI-safe tests (excluding Docker-based tests)..."
        echo "⚠️ Excluded projects (require Docker/Testcontainers):"
        echo "   - FluxIndex.Storage.Neo4j.Tests"
        echo "   - FluxIndex.Storage.Qdrant.Tests"
        echo "   - FluxIndex.Cache.Redis.Tests"
        echo "   - FluxIndex.Storage.PostgreSQL.Tests"
        echo ""

        # Run only CI-safe test projects (no Docker dependencies)
        CI_SAFE_TESTS=(
          "tests/FluxIndex.Core.Tests/FluxIndex.Core.Tests.csproj"
          "tests/FluxIndex.SDK.Tests/FluxIndex.SDK.Tests.csproj"
          "tests/FluxIndex.Storage.SQLite.Tests/FluxIndex.Storage.SQLite.Tests.csproj"
          "tests/FluxIndex.Extensions.FileVault.Tests/FluxIndex.Extensions.FileVault.Tests.csproj"
        )

        for project in "${CI_SAFE_TESTS[@]}"; do
          if [[ -f "$project" ]]; then
            echo "🧪 Testing: $project"
            dotnet test "$project" --no-build --configuration ${{ env.CONFIGURATION }} \
              --verbosity minimal \
              --collect:"XPlat Code Coverage" || true
          fi
        done

        echo "✅ CI-safe tests completed"

    # Create NuGet packages (only src projects)
    - name: Create packages
      if: steps.changes.outputs.should_run == 'true'
      run: |
        echo "📦 Creating NuGet packages for src projects only..."
        echo "🔍 Scanning src directory for packable projects..."

        # Ensure packages directory exists
        mkdir -p ./packages

        # Pack only projects in src folder and verify they are packable
        PACKAGED_COUNT=0
        for proj in src/**/*.csproj; do
          if [[ -f "$proj" ]]; then
            PROJECT_NAME=$(basename "$proj" .csproj)
            echo "📦 Packing $PROJECT_NAME..."

            # Check if project is packable before attempting to pack
            if dotnet pack "$proj" --configuration ${{ env.CONFIGURATION }} \
              --no-build \
              --output ./packages \
              --verbosity minimal \
              /p:Version=${{ steps.version.outputs.version }}; then
              PACKAGED_COUNT=$((PACKAGED_COUNT + 1))
              echo "✅ Successfully packaged $PROJECT_NAME"
            else
              echo "⚠️ Failed to package $PROJECT_NAME (might be non-packable)"
            fi
          fi
        done

        echo "📊 Summary: $PACKAGED_COUNT packages created"
        ls -la ./packages/ || echo "No packages directory found"

    # Check if version already exists on NuGet
    - name: Check version on NuGet
      if: steps.changes.outputs.should_run == 'true'
      id: version_check
      run: |
        VERSION=${{ steps.version.outputs.version }}
        echo "🔍 Checking if version $VERSION exists on NuGet..."

        # Check main FluxIndex package
        RESPONSE=$(curl -s "https://api.nuget.org/v3-flatcontainer/fluxindex/index.json" || echo '{"versions":[]}')

        if echo "$RESPONSE" | grep -q "\"$VERSION\""; then
          echo "version_exists=true" >> $GITHUB_OUTPUT
          echo "⚠️ Version $VERSION already exists on NuGet"
        else
          echo "version_exists=false" >> $GITHUB_OUTPUT
          echo "✅ Version $VERSION is new"
        fi

    # Publish to NuGet (only if version doesn't exist or force_publish is true)
    - name: Publish to NuGet
      if: |
        steps.changes.outputs.should_run == 'true' &&
        (steps.version_check.outputs.version_exists == 'false' || github.event.inputs.force_publish == 'true')
      run: |
        echo "🚀 Publishing packages to NuGet..."
        for package in ./packages/*.nupkg; do
          echo "Publishing $(basename $package)..."
          dotnet nuget push $package \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        done

    # Upload packages as artifacts
    - name: Upload packages
      if: steps.changes.outputs.should_run == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages-v${{ steps.version.outputs.version }}
        path: ./packages/*
        retention-days: 30

    # Build summary
    - name: Summary
      if: always()
      run: |
        echo "## 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| 📦 Version | \`${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| 🏁 Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🚀 Published | ${{ (steps.version_check.outputs.version_exists == 'false' || github.event.inputs.force_publish == 'true') && 'Yes' || 'No' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🎯 .NET | ${{ env.DOTNET_VERSION }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🔧 Config | ${{ env.CONFIGURATION }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🌿 Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 👤 Actor | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [[ "${{ steps.version_check.outputs.version_exists }}" == "true" && "${{ github.event.inputs.force_publish }}" != "true" ]]; then
          echo "ℹ️ **Note**: Version already exists on NuGet, skipped publishing" >> $GITHUB_STEP_SUMMARY
        fi