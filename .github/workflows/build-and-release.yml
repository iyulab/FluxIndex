name: Build & Release

on:
  # 직접 push 시 실행
  push:
    branches: [main]
    paths:
      - 'Directory.Build.props'
      # The pins decide what is built and what the nuspec depends on: a re-pin alone has to be built and tested.
      - 'Directory.Packages.props'
      - 'Directory.Build.targets'
      - 'src/**'
      # tests/ and the workflow itself gate the release, so a change to either has to re-run this
      # job. Without them a test-only or CI-only change never exercised the gate it modified, and
      # the next release was the first run to use it.
      - 'tests/**'
      # The solution builds the CLI tool and the samples too; a change to either alone has to be built.
      - 'cli/**'
      - 'samples/**'
      - 'scripts/**'
      - '.github/workflows/build-and-release.yml'

  # 수동 실행 가능
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force publish to NuGet (even if version exists)'
        required: false
        default: false
        type: boolean

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: 'Release'
  CI: 'true'
  GITHUB_ACTIONS: 'true'
  # Redis tests read this to skip their Testcontainers fixtures (DockerTestHelper).
  SKIP_DOCKER_TESTS: 'true'
  # sqlite-vec is NOT skipped here. Availability is auto-detected from the native asset in the
  # build output, on CI exactly as locally — the package ships runtimes/linux-x64/native/vec0.so.
  # Set ENABLE_SQLITEVEC_TESTS=false only to opt out deliberately.
  # Performance tests are excluded by category in the test step, not by this variable.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default; every job below asks for what it needs.
permissions: {}

# The push to nuget.org is not made here. This workflow builds, tests and packs, uploads the packages as an artifact and asks the
# organization's central publisher (iyulab/nuget-publish) to push them; that repository holds the only trusted-publishing policy
# and checks this repository, this workflow file and the package ids against an allowlist. No NuGet credential lives here.
# The solution-wide pack also emits the command-line tool (FluxIndex.CLI, its own version line), so that id belongs on the allowlist too.
jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    # Always run for push and workflow_dispatch
    - name: Set run flags
      id: changes
      run: |
        echo "should_run=true" >> $GITHUB_OUTPUT
        echo "📦 Trigger: ${{ github.event_name }}"

    - name: Setup .NET
      if: steps.changes.outputs.should_run == 'true'
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # Extract version from Directory.Build.props
    - name: Extract version
      if: steps.changes.outputs.should_run == 'true'
      id: version
      run: |
        VERSION=$(grep '<Version>' Directory.Build.props | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "📦 Version: $VERSION"

    # Clear NuGet cache to avoid hash validation issues
    - name: Clear NuGet cache
      if: steps.changes.outputs.should_run == 'true'
      run: |
        echo "🧹 Clearing NuGet cache to avoid hash validation issues..."
        dotnet nuget locals all --clear
        echo "✅ NuGet cache cleared"

    # Restore, Build, Test
    - name: Restore dependencies
      if: steps.changes.outputs.should_run == 'true'
      run: |
        echo "📦 Restoring packages with central package management..."
        # Force clean restore to avoid any cached issues
        # --force-evaluate: Re-evaluate all packages and update lock files
        # --ignore-failed-sources: Continue even if some sources fail
        dotnet restore --verbosity minimal --force --force-evaluate --ignore-failed-sources
        echo "✅ Package restore completed"

    - name: Build
      if: steps.changes.outputs.should_run == 'true'
      run: |
        echo "🔨 Building solution..."
        dotnet build --no-restore --configuration ${{ env.CONFIGURATION }} --verbosity minimal
        echo "✅ Build completed successfully"

    # The release gate and the pull-request workflow run the SAME runner script. They used to carry
    # two implementations of one convention -- this step in bash, `test.yml` in pwsh -- and two
    # implementations of a rule drift apart in opposite directions without either side noticing.
    # `scripts/test.ps1` is the single definition, so a local run is also the run that gates.
    #
    # What that script guarantees, and why (the reasoning lives with the code, not here):
    #   - enumerates test projects by discovery, never by an allowlist
    #   - excludes Integration/Performance by CATEGORY, so an excluded test is excluded wherever
    #     it lives rather than wherever someone remembered to list it
    #   - fails on any failure. No `|| true`, no pass-rate threshold: 0.24.0 published 12 packages
    #     on top of two failing tests because a swallow made this step green, and nuget.org
    #     packages cannot be withdrawn once pushed.
    - name: Run tests
      if: steps.changes.outputs.should_run == 'true'
      run: pwsh ./scripts/test.ps1 -Verbosity minimal -Configuration ${{ env.CONFIGURATION }} -NoBuild -Coverage

    # Create NuGet packages — solution-wide pack ensures all family members are consistent
    - name: Create packages
      if: steps.changes.outputs.should_run == 'true'
      run: |
        echo "📦 Creating NuGet packages via solution-wide pack..."
        mkdir -p ./packages
        dotnet pack FluxIndex.slnx \
          --configuration ${{ env.CONFIGURATION }} \
          --no-build \
          --output ./packages \
          --verbosity minimal
        PACKAGED_COUNT=$(ls ./packages/*.nupkg 2>/dev/null | wc -l)
        echo "📊 Summary: $PACKAGED_COUNT packages created"
        ls -la ./packages/*.nupkg

    # Check if version already exists on NuGet (use FluxIndex.SDK as the canonical check package)
    - name: Check version on NuGet
      if: steps.changes.outputs.should_run == 'true'
      id: version_check
      run: |
        VERSION=${{ steps.version.outputs.version }}
        echo "🔍 Checking if version $VERSION exists on NuGet (FluxIndex.SDK)..."

        RESPONSE=$(curl -s "https://api.nuget.org/v3-flatcontainer/fluxindex.sdk/index.json" || echo '{"versions":[]}')

        if echo "$RESPONSE" | grep -q "\"$VERSION\""; then
          echo "version_exists=true" >> $GITHUB_OUTPUT
          echo "⚠️ Version $VERSION already exists on NuGet — will skip unless force_publish=true"
        else
          echo "version_exists=false" >> $GITHUB_OUTPUT
          echo "✅ Version $VERSION is new"
        fi

    # Hand the packages over only if the version doesn't exist or force_publish is true
    - name: Decide whether to publish
      id: decide
      run: |
        if [ "${{ steps.version_check.outputs.version_exists }}" == "false" ] || [ "${{ github.event.inputs.force_publish }}" == "true" ]; then
          echo "publish=true" >> $GITHUB_OUTPUT
        else
          echo "publish=false" >> $GITHUB_OUTPUT
        fi

    # Only .nupkg and .snupkg files: the central publisher refuses an artifact that holds anything else.
    - name: Upload packages
      if: steps.decide.outputs.publish == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: |
          ./packages/*.nupkg
          ./packages/*.snupkg
        if-no-files-found: error
        retention-days: 1

    # Build summary
    - name: Summary
      if: always()
      run: |
        echo "## 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| 📦 Version | \`${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| 🏁 Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🚀 Handed to the publisher | ${{ steps.decide.outputs.publish == 'true' && 'Yes' || 'No' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🎯 .NET | ${{ env.DOTNET_VERSION }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🔧 Config | ${{ env.CONFIGURATION }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🌿 Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 👤 Actor | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [[ "${{ steps.version_check.outputs.version_exists }}" == "true" && "${{ github.event.inputs.force_publish }}" != "true" ]]; then
          echo "ℹ️ **Note**: Version already exists on NuGet, skipped publishing" >> $GITHUB_STEP_SUMMARY
        fi

  # Asks the central publisher to push the packages and waits for its answer: this job succeeds only when they are on nuget.org.
  # Until the repository is on the publisher's allowlist the call is refused and the jobs after it do not run.
  publish:
    needs: pack
    if: ${{ needs.pack.outputs.publish == 'true' }}
    uses: iyulab/nuget-publish/.github/workflows/request.yml@2166748abf716fb58855228f65fc6b8f78c2780f # main
    permissions: {}
    secrets: inherit

  # The tag and the GitHub release exist only for a version that reached nuget.org.
  release:
    needs: [pack, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # tag + GitHub release
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    # Release notes = this version's CHANGELOG.md section. Every iyulab publish workflow carries this awk program
    # verbatim; change it in all of them or in none.
    - name: GitHub release (notes = this version's CHANGELOG section)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION=$(grep -oP '<(Version|VersionPrefix)>\K[^<]+' Directory.Build.props | head -1)
        if gh release view "v$VERSION" >/dev/null 2>&1; then echo "Release v$VERSION already exists"; exit 0; fi
        awk -v v="$VERSION" '/^## /{if(p)exit;h=$0;sub(/^## +\[?v?/,"",h);c=substr(h,length(v)+1,1);if(index(h,v)==1&&(c==""||c=="]"||c==" "||c=="\t")){p=1;next}}p&&(n||$0!~/^[ \t]*$/){l[++n]=$0}END{while(n&&(l[n]~/^[ \t]*$/||l[n]~/^---+$/))n--;for(i=1;i<=n;i++)print l[i]}' CHANGELOG.md > release-notes.md
        if [ ! -s release-notes.md ]; then echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; fi
        gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md --target "$GITHUB_SHA"