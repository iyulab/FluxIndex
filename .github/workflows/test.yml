name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests (Mock Mode)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Clear NuGet cache and lock files
      run: |
        dotnet nuget locals all --clear
        find . -name "packages.lock.json" -delete

    - name: Restore dependencies
      run: dotnet restore --ignore-failed-sources

    - name: Build
      run: dotnet build --configuration Release --no-restore

    # -NoBuild: the step above already built this configuration. Without it the runner compiles the
    # whole solution twice per run.
    - name: Run Mock Tests (CI/CD Mode)
      run: pwsh ./scripts/mock-test.ps1 -Verbosity minimal -Configuration Release -NoBuild

