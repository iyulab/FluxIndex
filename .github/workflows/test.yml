name: Tests

# No `push` to main. `build-and-release.yml` already runs the same script as its release gate on
# every main push that touches src/ or tests/, so listing main here ran the whole suite twice per
# push for no additional signal. Pull requests and develop are not covered by that workflow, which
# is what this one is for.
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests (Mock Mode)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Clear NuGet cache and lock files
      run: |
        dotnet nuget locals all --clear
        find . -name "packages.lock.json" -delete

    - name: Restore dependencies
      run: dotnet restore --ignore-failed-sources

    - name: Build
      run: dotnet build --configuration Release --no-restore

    # -NoBuild: the step above already built this configuration. Without it the runner compiles the
    # whole solution twice per run.
    #
    # Same script as the release gate in `build-and-release.yml`, deliberately: one definition of
    # what "the tests pass" means, used by both workflows and by a local run.
    - name: Run tests
      run: pwsh ./scripts/test.ps1 -Verbosity minimal -Configuration Release -NoBuild

