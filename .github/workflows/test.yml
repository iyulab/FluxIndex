name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests (Mock Mode)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Clear NuGet cache and lock files
      run: |
        dotnet nuget locals all --clear
        find . -name "packages.lock.json" -delete

    - name: Restore dependencies
      run: dotnet restore --ignore-failed-sources

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Run Mock Tests (CI/CD Mode)
      run: pwsh ./scripts/mock-test.ps1 -Verbosity minimal -Configuration Release

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/TestResults/*.trx'
        retention-days: 7

  test-with-coverage:
    name: Run Tests with Coverage
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Clear NuGet cache and lock files
      run: |
        dotnet nuget locals all --clear
        find . -name "packages.lock.json" -delete

    - name: Restore dependencies
      run: dotnet restore --ignore-failed-sources

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Run Mock Tests with Coverage
      run: pwsh ./scripts/mock-test.ps1 -Verbosity minimal -Configuration Release -Coverage

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: '**/TestResults/**/coverage.cobertura.xml'
        retention-days: 30
