name: Stack Docker Release

on:
  push:
    branches: [ main ]
    paths:
      - 'stack/**'
      - 'src/**'
      - 'Directory.Build.props'

  workflow_dispatch:
    inputs:
      build_api:
        description: 'Build API image'
        required: false
        default: true
        type: boolean
      build_frontend:
        description: 'Build Frontend image'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: iyulab/fluxindex-stack-api
  FRONTEND_IMAGE_NAME: iyulab/fluxindex-stack-frontend

jobs:
  build-api:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.build_api == 'true' }}
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract version
      id: version
      run: |
        VERSION=$(grep '<Version>' Directory.Build.props | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "📦 Version: $VERSION"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}
        tags: |
          type=raw,value=${{ steps.version.outputs.version }}
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,prefix=

    - name: Build and push API image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./stack/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

    - name: Summary
      run: |
        echo "## 🐳 API Docker Image Published" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| 📦 Image | \`${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| 🏷️ Version | \`${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| 🏁 Status | Success |" >> $GITHUB_STEP_SUMMARY

  build-frontend:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.build_frontend == 'true' }}
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract version
      id: version
      run: |
        VERSION=$(grep '<Version>' Directory.Build.props | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "📦 Version: $VERSION"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
        tags: |
          type=raw,value=${{ steps.version.outputs.version }}
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,prefix=

    - name: Build and push Frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./stack/frontend
        file: ./stack/frontend/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

    - name: Summary
      run: |
        echo "## 🐳 Frontend Docker Image Published" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| 📦 Image | \`${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| 🏷️ Version | \`${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| 🏁 Status | Success |" >> $GITHUB_STEP_SUMMARY
