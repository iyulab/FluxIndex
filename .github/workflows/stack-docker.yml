name: Stack Docker Release

on:
  # Stack Docker builds are temporarily disabled.
  # The stack/ code has CA1000 build errors that need to be fixed before re-enabling.
  # To re-enable: uncomment the workflow_run trigger below.
  #
  # workflow_run:
  #   workflows: ["Tests"]
  #   types: [completed]
  #   branches: [main]

  workflow_dispatch:
    inputs:
      build_api:
        description: 'Build API image'
        required: false
        default: true
        type: boolean
      build_frontend:
        description: 'Build Frontend image'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: iyulab/fluxindex-stack-api
  FRONTEND_IMAGE_NAME: iyulab/fluxindex-stack-frontend

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Tests 성공 시에만 실행 (workflow_dispatch는 항상 실행)
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.build_api == 'true' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    # Check if relevant files changed (for workflow_run trigger)
    - name: Check for relevant changes
      id: changes
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "should_run=true" >> $GITHUB_OUTPUT
          echo "📦 Manual trigger - will run"
        else
          COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
          echo "🔍 Checking changes in commit: $COMMIT_SHA"

          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r $COMMIT_SHA 2>/dev/null || echo "")
          echo "Changed files: $CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -qE "^(stack/|src/|Directory\.Build\.props)"; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "✅ Relevant files changed - will run"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "⏭️ No relevant changes - skipping"
          fi
        fi

    - name: Extract version
      if: steps.changes.outputs.should_run == 'true'
      id: version
      run: |
        VERSION=$(grep '<Version>' Directory.Build.props | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "📦 Version: $VERSION"

    - name: Set up Docker Buildx
      if: steps.changes.outputs.should_run == 'true'
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: steps.changes.outputs.should_run == 'true'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels)
      if: steps.changes.outputs.should_run == 'true'
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}
        tags: |
          type=raw,value=${{ steps.version.outputs.version }}
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,prefix=

    - name: Build and push API image
      if: steps.changes.outputs.should_run == 'true'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./stack/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

    - name: Summary
      if: steps.changes.outputs.should_run == 'true'
      run: |
        echo "## 🐳 API Docker Image Published" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| 📦 Image | \`${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| 🏷️ Version | \`${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| 🏁 Status | Success |" >> $GITHUB_STEP_SUMMARY

  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Tests 성공 시에만 실행 (workflow_dispatch는 항상 실행)
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.build_frontend == 'true' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    # Check if relevant files changed (for workflow_run trigger)
    - name: Check for relevant changes
      id: changes
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "should_run=true" >> $GITHUB_OUTPUT
          echo "📦 Manual trigger - will run"
        else
          COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
          echo "🔍 Checking changes in commit: $COMMIT_SHA"

          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r $COMMIT_SHA 2>/dev/null || echo "")
          echo "Changed files: $CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -qE "^(stack/|src/|Directory\.Build\.props)"; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "✅ Relevant files changed - will run"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "⏭️ No relevant changes - skipping"
          fi
        fi

    - name: Extract version
      if: steps.changes.outputs.should_run == 'true'
      id: version
      run: |
        VERSION=$(grep '<Version>' Directory.Build.props | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "📦 Version: $VERSION"

    - name: Set up Docker Buildx
      if: steps.changes.outputs.should_run == 'true'
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: steps.changes.outputs.should_run == 'true'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels)
      if: steps.changes.outputs.should_run == 'true'
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
        tags: |
          type=raw,value=${{ steps.version.outputs.version }}
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,prefix=

    - name: Build and push Frontend image
      if: steps.changes.outputs.should_run == 'true'
      uses: docker/build-push-action@v5
      with:
        context: ./stack/frontend
        file: ./stack/frontend/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

    - name: Summary
      if: steps.changes.outputs.should_run == 'true'
      run: |
        echo "## 🐳 Frontend Docker Image Published" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| 📦 Image | \`${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| 🏷️ Version | \`${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| 🏁 Status | Success |" >> $GITHUB_STEP_SUMMARY
