# FluxIndex Production Infrastructure
# PostgreSQL (pgvector) + Qdrant + Neo4j + Redis
# Usage: docker-compose up -d

services:
  # =============================================================================
  # API Service
  # =============================================================================
  api:
    container_name: fluxindex-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PostgreSQL: Host=postgres;Port=5432;Database=fluxindex;Username=${POSTGRES_USER:-fluxindex};Password=${POSTGRES_PASSWORD:-fluxindex};Pooling=true;MinPoolSize=5;MaxPoolSize=100
      ConnectionStrings__Redis: redis:6379,abortConnect=false,connectTimeout=5000
      ConnectionStrings__Qdrant: http://qdrant:6333
      ConnectionStrings__Neo4j: bolt://neo4j:7687
      Neo4j__Username: neo4j
      Neo4j__Password: ${NEO4J_PASSWORD:-fluxindex123}
      OpenAI__ApiKey: ${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    restart: unless-stopped
    networks:
      - fluxindex-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # Frontend Service
  # =============================================================================
  frontend:
    container_name: fluxindex-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    restart: unless-stopped
    networks:
      - fluxindex-network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # =============================================================================
  # PostgreSQL with pgvector - Primary Database & Vector Store
  # =============================================================================
  postgres:
    container_name: fluxindex-postgres
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fluxindex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fluxindex}
      POSTGRES_DB: ${POSTGRES_DB:-fluxindex}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "work_mem=256MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "effective_cache_size=3GB"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "wal_buffers=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "log_statement=none"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "idle_in_transaction_session_timeout=30000"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fluxindex} -d ${POSTGRES_DB:-fluxindex}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    restart: unless-stopped
    networks:
      - fluxindex-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # =============================================================================
  # Qdrant - High-Performance Vector Database
  # =============================================================================
  qdrant:
    container_name: fluxindex-qdrant
    image: qdrant/qdrant:v1.12.4
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__LOG_LEVEL: WARN
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "true"
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: 0
      QDRANT__STORAGE__OPTIMIZERS__DEFAULT_SEGMENT_NUMBER: 4
      QDRANT__STORAGE__HNSW_INDEX__ON_DISK: "false"
    volumes:
      - qdrant-data:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    restart: unless-stopped
    networks:
      - fluxindex-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # Neo4j - Graph Database for Knowledge Graph
  # =============================================================================
  neo4j:
    container_name: fluxindex-neo4j
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-fluxindex123}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
      NEO4J_server_config_strict__validation_enabled: "false"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-plugins:/plugins
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    restart: unless-stopped
    networks:
      - fluxindex-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # Redis - Caching & Session Store
  # =============================================================================
  redis:
    container_name: fluxindex-redis
    image: redis:7.4-alpine
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --appendonly yes
      - --appendfsync everysec
      - --maxmemory 512mb
      - --maxmemory-policy allkeys-lru
      - --tcp-keepalive 60
      - --timeout 300
      - --tcp-backlog 511
      - --save 900 1
      - --save 300 10
      - --save 60 10000
      - --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    restart: unless-stopped
    networks:
      - fluxindex-network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres-data:
    driver: local
  qdrant-data:
    driver: local
  qdrant-snapshots:
    driver: local
  neo4j-data:
    driver: local
  neo4j-logs:
    driver: local
  neo4j-plugins:
    driver: local
  redis-data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  fluxindex-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
