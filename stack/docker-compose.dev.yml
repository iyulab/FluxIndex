# FluxIndex Development Infrastructure
# PostgreSQL (pgvector) + Qdrant + Neo4j + Redis
# Usage: docker-compose -f docker-compose.dev.yml up -d

services:
  # =============================================================================
  # PostgreSQL with pgvector - Primary Database & Vector Store
  # =============================================================================
  postgres:
    container_name: fluxindex-postgres
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: fluxindex
      POSTGRES_PASSWORD: fluxindex
      POSTGRES_DB: fluxindex
      # Performance tuning for development
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "log_statement=none"
      - "-c"
      - "log_min_duration_statement=1000"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxindex -d fluxindex"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - fluxindex-dev

  # =============================================================================
  # Qdrant - High-Performance Vector Database
  # =============================================================================
  qdrant:
    container_name: fluxindex-qdrant
    image: qdrant/qdrant:v1.12.4
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__LOG_LEVEL: INFO
      # Performance settings
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "true"
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: 0
    volumes:
      - qdrant-dev-data:/qdrant/storage
      - qdrant-dev-snapshots:/qdrant/snapshots
    ports:
      - "6335:6333"  # REST API
      - "6336:6334"  # gRPC
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - fluxindex-dev

  # =============================================================================
  # Neo4j - Graph Database for Knowledge Graph & Relationships
  # =============================================================================
  neo4j:
    container_name: fluxindex-neo4j
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/fluxindex123
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      # Memory configuration
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      # Performance settings
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
      NEO4J_server_config_strict__validation_enabled: "false"
    volumes:
      - neo4j-dev-data:/data
      - neo4j-dev-logs:/logs
      - neo4j-dev-plugins:/plugins
    ports:
      - "7475:7474"  # HTTP (Browser)
      - "7688:7687"  # Bolt
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - fluxindex-dev

  # =============================================================================
  # Redis - Caching & Session Store
  # =============================================================================
  redis:
    container_name: fluxindex-redis
    image: redis:7.4-alpine
    volumes:
      - redis-dev-data:/data
    ports:
      - "6381:6379"
    command:
      - redis-server
      - --appendonly yes
      - --appendfsync everysec
      - --maxmemory 256mb
      - --maxmemory-policy allkeys-lru
      - --tcp-keepalive 60
      - --timeout 0
      - --tcp-backlog 511
      - --save 900 1
      - --save 300 10
      - --save 60 10000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - fluxindex-dev

  # =============================================================================
  # Redis Commander - Redis GUI (Development Only)
  # =============================================================================
  redis-commander:
    container_name: fluxindex-redis-commander
    image: rediscommander/redis-commander:latest
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fluxindex-dev
    profiles:
      - tools

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres-dev-data:
    driver: local
  qdrant-dev-data:
    driver: local
  qdrant-dev-snapshots:
    driver: local
  neo4j-dev-data:
    driver: local
  neo4j-dev-logs:
    driver: local
  neo4j-dev-plugins:
    driver: local
  redis-dev-data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  fluxindex-dev:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
