# Prometheus configuration for FluxIndex Stack
# Scrapes metrics from FluxIndex API and infrastructure services

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'fluxindex-stack'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Load rules once and periodically evaluate them
# rule_files:
#   - /etc/prometheus/rules/*.yml

scrape_configs:
  # FluxIndex API metrics
  - job_name: 'fluxindex-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8080']
        labels:
          service: 'fluxindex-api'
          environment: 'production'
    # Handle potential API key requirements
    # bearer_token: ''

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Redis metrics (requires redis_exporter sidecar, optional)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # PostgreSQL metrics (requires postgres_exporter sidecar, optional)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # Qdrant metrics (built-in, if enabled)
  - job_name: 'qdrant'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['qdrant:6333']
        labels:
          service: 'qdrant'
          environment: 'production'
