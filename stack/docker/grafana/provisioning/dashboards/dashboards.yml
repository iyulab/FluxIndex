# Grafana dashboard provisioning for FluxIndex Stack
apiVersion: 1

providers:
  - name: 'FluxIndex Dashboards'
    orgId: 1
    folder: 'FluxIndex'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
